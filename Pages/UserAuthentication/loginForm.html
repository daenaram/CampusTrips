<!DOCTYPE html>
<html lang="en">

<head>
    <script src="/AUT-Web-Based-Travel-Planner/assets/js/pwa.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../../assets/css/loginformStyles.css">

    <link rel="stylesheet" href="../../assets/css/loginStyle.css">
    <script type="module" src="../../assets/js/loginForm.js?v=7"></script>
    <title>AUT Web-Based Travel Planner</title>
</head>

<body>
    <!--Close btn to go back to index.html-->
    <a href="../../index.html" class="floating-close-btn" aria-label="Close and return to home">
        &times;
    </a>

    <!-- Passport book container -->
    <div class="book" id="passport" onclick="togglePassport()" aria-label="Open Passport Login">

        <!-- Passport cover -->
        <div class="passport-cover">
            <div class="passport-front">
                <div class="cover-font">
                    <a href="../../index.html"><img src="../../assets/images/aut_logo.svg" alt="AUT Logo" class="logo"></a>
                    <h1>PASSPORT</h1>
                    <p>AUT TRAVEL PLANNER</p>
                    <span class="hint">CLICK TO OPEN</span>
                </div>
            </div>
        </div>

        <!-- Form Page -->
        <div class="login-page">
            <form method="POST" action="login.php" onclick="event.stopPropagation()">
                <h2>Login</h2>
                <input type="hidden" id="redirectField" name="redirect" value="">

                <div class="input-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>

                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" onclick="togglePassword()">
                        <span>Show Password</span>
                    </label>
                    <br>
                    <a href="forgot_password.html" class="forgot">Forgot Password?</a>
                </div>

                <button type="submit" class="loginbtn">Login</button>
                <button type="button" onclick="location.href='signup.html'" class="signbtn">Sign Up</button>

                <div class="divider">OR</div>

                <!-- Social Logins -->
                <div class="social_con">
                    <button type="button" class="social_btn" onclick="loginWithGoogle()">
                        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
                        <span>Google</span>
                    </button>
                    <button type="button" class="social_btn" onclick="loginWithApple()">
                        <img src="https://www.svgrepo.com/show/69341/apple-logo.svg" alt="Apple">
                        <span>Apple</span>
                    </button>

                    <button type="button" class="social_btn" onclick="loginWithAUT()">
                        <img src="../../assets/images/aut_logo.svg" alt="AUT">
                        <span>Continue with AUT Login</span>
                    </button>
                </div>
                <p id="loginMessage" class="loginMessage"></p>
            </form>
        </div>
    </div>


    <script>
        function togglePassport() {
            document.getElementById('passport').classList.toggle('open');
        }
    </script>



    <!-- Error Modal -->
    <div id="error-modal" class="modal-overlay">
        <div class="modal-box">
            <h3>Login Error</h3>
            <p>An error occurred. Please try again.</p>
            <button class="modal-close-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <script src="../../assets/js/login.js"></script>
    <script src="../../assets/js/viewPassword.js"></script>

    <!--Account delete successful message-->
    <script>
        const params = new URLSearchParams(window.location.search);

        if (params.get("account_deleted") === "true") {
            alert("Your account has been deleted successfully.");
        }

        // Carry a "come back here after login" target through to login.php,
        // e.g. when arriving from a shared trip link's "Sign in to edit"
        // prompt. login.php only ever honours a small whitelist of paths.
        const redirectField = document.getElementById("redirectField");
        if (redirectField && params.get("redirect")) {
            redirectField.value = params.get("redirect");
        }
    </script>

</body>

</html>
